server.port=18083
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.api-url=https://api.deepseek.com/chat/completions
ai.deepseek.model=deepseek-v4-flash

# 将调用记录保存在 backend/data 文件夹，重启程序后记录仍然存在。
spring.datasource.url=jdbc:h2:file:./data/llm-gateway
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# update 表示程序会根据实体类自动创建或更新数据表。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
