server.port=18083
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.api-url=https://api.deepseek.com/chat/completions
ai.deepseek.model=deepseek-v4-flash

# 单机版固定窗口限流；部署多实例时可替换为 Redis + Lua 实现。
gateway.rate-limit.max-requests=${GATEWAY_RATE_LIMIT_MAX:20}
gateway.rate-limit.window-seconds=${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}

# 在日志中打印请求编号，便于根据响应头 X-Request-ID 定位一次完整调用。
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-system}] %logger{36} - %msg%n

# 将调用记录保存在 backend/data 文件夹，重启程序后记录仍然存在。
spring.datasource.url=jdbc:h2:file:./data/llm-gateway
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# update 表示程序会根据实体类自动创建或更新数据表。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
